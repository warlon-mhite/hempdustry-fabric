plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

// The Minecraft version rides along as semver build metadata, so the jar in a mods folder says
// which game it is for. Comparison ignores everything after '+', so the update checker still
// reads 2.0.0+1.21.1 and 2.0.0 as the same release.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// The three recipe viewers. All compile-only -- see the dependencies block.
	maven {
		name = "TerraformersMC"          // EMI
		url = "https://maven.terraformersmc.com/releases/"
	}
	maven {
		name = "BlameJared"              // JEI
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "shedaniel"               // REI, and the cloth-config it pulls in
		url = "https://maven.shedaniel.me/"
	}
	maven {
		name = "architectury"            // REI's other transitive dep, and where me.shedaniel.math lives
		url = "https://maven.architectury.dev/"
	}
}

fabricApi {
	configureDataGeneration()
}

// configureDataGeneration() adds src/main/generated to the `clean` task, and that is wrong here:
// the datagen output is committed on purpose (it ships inside the jar, so a clean clone has to
// build a working mod — see .gitignore). Left alone, `gradlew clean` deletes 446 tracked files and
// the next `git add -A` quietly commits the deletion; the mod then loads with no models, loot
// tables, recipes, advancements or worldgen, and the first symptom is a crash on world load rather
// than anything that names the real problem. `clean` still deletes build/ as normal.
tasks.named('clean', Delete) {
	def datagenOutput = file('src/main/generated').absolutePath
	delete = delete.findAll { it.toString() != datagenOutput }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// Recipe viewers. Compiled against, never shipped: each plugin is loaded by its own viewer and
	// by nothing else, so a player with neither installed never loads a line of that code.
	modCompileOnly "dev.emi:emi-fabric:${project.emi_version}:api"

	// jei-*-fabric-api pulls jei-*-common-api-INTERMEDIARY transitively, and that variant is the
	// one that matters: the plain common-api jar is Mojang-mapped and its Minecraft references
	// would not resolve in a yarn workspace. Verified with javap -- the intermediary jar's
	// IRecipeCategory#getTitle returns class_2561, the Mojang-mapped one returns Component.
	modCompileOnly "mezz.jei:jei-1.21.1-fabric-api:${project.jei_version}"

	// REI is two artifacts: the api, and the default plugin -- which is where
	// DefaultCustomShapelessDisplay lives, the shape the packing rows are handed over in. Plus
	// basic-math, because REI 16's api poms list no dependencies and me.shedaniel.math.Rectangle
	// has to come from somewhere -- see gradle.properties.
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-api-fabric:${project.rei_version}"
	modCompileOnly "me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${project.rei_version}"
	compileOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"
	modCompileOnly "dev.architectury:architectury-fabric:${project.architectury_version}"

	// ONE VIEWER AT A TIME IN DEV, and this is not a preference -- it is the only way to test JEI.
	//
	// With EMI also installed, JEI still starts, still finds this mod's plugin through the
	// jei_mod_plugin entrypoint, still constructs it and still calls getPluginUid() on it about
	// thirty times -- and then never calls a single registration phase. Nothing is logged, and the
	// plugin looks dead while its code is fine. The cause is EMI: emi.mixins.json declares
	// "jei.PluginCallerMixin", so EMI mixes into JEI's PluginCaller and suppresses it when both are
	// present. Remove EMI and every phase fires immediately.
	//
	//   ./gradlew runClient                  # EMI (default)
	//   ./gradlew runClient -Pviewer=jei     # JEI
	//   ./gradlew runClient -Pviewer=rei     # REI
	//   ./gradlew runClient -Pviewer=none    # none of them
	//
	// Players install one of the three, so this costs them nothing.
	//
	// -P only reaches a build started from the terminal. A run launched from the IDE uses whatever
	// the last Gradle sync resolved, which is EMI -- so to test JEI or REI from the IDE, put
	// `viewer=rei` in gradle.properties (findProperty reads it) or in ~/.gradle/gradle.properties,
	// and re-sync.
	def viewer = project.findProperty("viewer") ?: "emi"
	if (viewer == "emi") {
		modLocalRuntime "dev.emi:emi-fabric:${project.emi_version}"
	} else if (viewer == "jei") {
		modLocalRuntime "mezz.jei:jei-1.21.1-fabric:${project.jei_version}"
	} else if (viewer == "rei") {
		modLocalRuntime "me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}"
	} else if (viewer != "none") {
		throw new GradleException("Unknown -Pviewer=${viewer}; use emi, jei, rei or none")
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// Pinned rather than inherited: several source files carry non-ASCII characters, and the
	// platform default differs on a Windows contributor's machine.
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	// The music is Nefuß's, under CC BY-NC-SA 4.0 rather than the mod's AGPL, and that licence
	// wants its attribution to travel with the files — so the credits ship inside the jar.
	from("CREDITS.md") {
		rename { "CREDITS_${project.base.archivesName.get()}.md"}
	}
}

// Publishing, so an addon can compile against com.warlonmhite.hempdustry.api.
//
// There are two mavens and only one of them needs anything here. Modrinth serves every uploaded
// file as a maven artifact for free, which is the one an addon author will actually use:
//
//   repositories { maven { url = "https://api.modrinth.com/maven" } }
//   dependencies { modImplementation "maven.modrinth:hempdustry:2.0.0-beta+1.21.1" }
//
// GitHub Packages is the second, for builds that are not on Modrinth yet. It is only wired up when
// credentials are actually present, so a clean clone still builds and `publish` still works
// offline by falling through to the local maven.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			// components.java is loom's remapped jar plus the sources jar, which is what a
			// consumer needs: the intermediary-mapped classes a running game actually has.
			from components.java

			pom {
				name = "Hempdustry"
				description = "Minecraft for stoners and hemprepreneurs."
				url = "https://modrinth.com/mod/hempdustry"
				licenses {
					license {
						// Code and data only. The art and music are CC-BY-NC-SA-4.0 and travel
						// with CREDITS.md inside the jar — see the `jar` block above.
						name = "AGPL-3.0-only"
						url = "https://www.gnu.org/licenses/agpl-3.0.txt"
					}
				}
			}
		}
	}

	repositories {
		def githubUser = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
		def githubKey = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
		if (githubUser && githubKey) {
			maven {
				name = "GitHubPackages"
				url = "https://maven.pkg.github.com/warlon-mhite/hempdustry-fabric"
				credentials {
					username = githubUser
					password = githubKey
				}
			}
		}
		// Always available, and what `publishToMavenLocal` targets: enough for an addon author to
		// build against an unreleased jar.
		mavenLocal()
	}
}
