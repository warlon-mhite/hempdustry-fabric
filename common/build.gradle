// The mod itself, on plain Minecraft: compiled against vanilla only (Mojang's names and Parchment), so
// nothing here can reach a loader by accident -- an import from Forge fails to compile. The forge
// project compiles these sources into its own jar; this project's own jar is never shipped.
plugins {
	id 'multiloader-common'
	id 'dev.architectury.loom'
}

loom {
	// What the mod reaches in vanilla that vanilla keeps closed. Forge reads it converted to an
	// access transformer (forge/build.gradle).
	accessWidenerPath = file('src/main/resources/hempdustry.accesswidener')
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
	}
	// The mixins target vanilla, so they live here; Forge 36.2 ships Mixin.
	compileOnly "org.spongepowered:mixin:${mixin_version}"
	// @Nullable and friends; Minecraft brings them at run time.
	compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"
}

sourceSets.main.resources.srcDir 'src/generated/resources'

// The game tests and their harness: plain Minecraft too, so a test cannot reach Forge by accident.
// Compiled here only to keep them loader-free; forge's game-test source set compiles and runs them.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
	}
}

dependencies {
	// the newer lines' syntax in the tests too, as in the mod (multiloader-common)
	gametestAnnotationProcessor "com.github.bsideup.jabel:jabel-javac-plugin:${jabel_version}"
	gametestCompileOnly "com.github.bsideup.jabel:jabel-javac-plugin:${jabel_version}"
}

// What the forge project takes from here: the sources, and the resources -- hand-written and
// generated -- that ship inside its jar.
configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
	commonGametestJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonGametestResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava file('src/main/java')
	commonResources file('src/main/resources')
	commonResources file('src/generated/resources')
	commonGametestJava file('src/gametest/java')
	commonGametestResources file('src/gametest/resources')
}
