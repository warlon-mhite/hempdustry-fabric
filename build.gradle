plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
}

// The Minecraft version rides along as semver build metadata, so the jar in a mods folder says
// which game it is for. Comparison ignores everything after '+', so the update checker still
// reads 2.0.0+1.21.1 and 2.0.0 as the same release.
version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration()
}

// configureDataGeneration() adds src/main/generated to the `clean` task, and that is wrong here:
// the datagen output is committed on purpose (it ships inside the jar, so a clean clone has to
// build a working mod — see .gitignore). Left alone, `gradlew clean` deletes 446 tracked files and
// the next `git add -A` quietly commits the deletion; the mod then loads with no models, loot
// tables, recipes, advancements or worldgen, and the first symptom is a crash on world load rather
// than anything that names the real problem. `clean` still deletes build/ as normal.
tasks.named('clean', Delete) {
	def datagenOutput = file('src/main/generated').absolutePath
	delete = delete.findAll { it.toString() != datagenOutput }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// Pinned rather than inherited: several source files carry non-ASCII characters, and the
	// platform default differs on a Windows contributor's machine.
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
	// The music is Nefuß's, under CC BY-NC-SA 4.0 rather than the mod's AGPL, and that licence
	// wants its attribution to travel with the files — so the credits ship inside the jar.
	from("CREDITS.md") {
		rename { "CREDITS_${project.base.archivesName.get()}.md"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}