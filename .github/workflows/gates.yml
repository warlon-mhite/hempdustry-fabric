# Every gate on every push: the same table `python3 scripts/gates.py` prints at home -- the script
# checks, the Forge game tests with their log gate, the data check, the build -- and then the API held
# to the last release, so no branch can drift red unseen. This line builds for Forge alone, and its data
# is the 1.20.1 line's datagen output converted to 1.16.5's formats, so that line is checked out beside
# it and the data gate converts it again, expecting no change.
name: Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes an older run's answer moot.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The releases whose API this build must keep (scripts/api_additive.py), one per loader, since a
      # Fabric jar and a Forge jar cannot be compared with each other, nor a jar of another Minecraft.
      # Empty until this line's first release on Minecraft 1.16.5; move both on at each release.
      API_BASELINE: ''
      NEOFORGE_API_BASELINE: v2.1.0
    steps:
      - uses: actions/checkout@v4

      # The data this line converts, from the line it is converted from.
      - uses: actions/checkout@v4
        with:
          ref: 1.20.1-2.1
          path: .upstream-1.20.1

      # Gradle runs on Java 21 (the last listed, so the default), Architectury Loom needs it; Java 17
      # compiles (javac with Jabel, to Java 8 bytecode), Java 8 runs the game.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Let Gradle find both JDKs
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64" >> ~/.gradle/gradle.properties

      # Compiled once before the gates: it fails early on a compile error, and it puts the game's client
      # jar in Loom's cache, where the recipe-collision and data gates read vanilla's recipes and ids.
      - name: Compile
        run: ./gradlew --console=plain :forge:compileJava

      - name: Fetch the released jars the API is held to
        run: |
          mc=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          mkdir -p build/baseline
          # fetch <loader> <tag> <file name>...: the first of those jars the release has for this Minecraft.
          fetch() {
            loader=$1 tag=$2
            shift 2
            [ -n "$tag" ] || return 0
            for name in "$@"; do
              if curl -fsL -o "build/baseline/$loader.jar" \
                  "https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$name%2B$mc.jar"; then
                return 0
              fi
              rm -f "build/baseline/$loader.jar"
            done
            # The commit that cuts a release already names it as the baseline, and is pushed before the
            # release is published: until then the build is the baseline, and there is nothing to hold it to.
            if [ "${tag#v}" = "$version" ]; then
              echo "::notice::$tag is the release this build makes; its $loader API is held to it once it is published"
              return 0
            fi
            echo "::error::release $tag has no $loader jar for Minecraft $mc"
            return 1
          }
          # Since 2.1.0 each jar is named for its loader; the 2.0.x jars were Fabric's alone and named for no loader.
          fetch fabric "$API_BASELINE" "hempdustry-fabric-${API_BASELINE#v}" "hempdustry-${API_BASELINE#v}"
          fetch neoforge "$NEOFORGE_API_BASELINE" "hempdustry-forge-${NEOFORGE_API_BASELINE#v}"

      - name: Gates
        run: |
          args=(--data-from .upstream-1.20.1)
          if [ -f build/baseline/fabric.jar ]; then args+=(--released build/baseline/fabric.jar); fi
          if [ -f build/baseline/neoforge.jar ]; then args+=(--released-neoforge build/baseline/neoforge.jar); fi
          python3 scripts/gates.py "${args[@]}"

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs
          path: |
            build/gates/*.log
            fabric/build/gametest/logs/
            forge/build/gametest/logs/
          if-no-files-found: ignore
