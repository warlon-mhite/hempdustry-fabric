// What every project of the mod shares: Java 8 classes, the repositories, the version and the jar's licences.
plugins {
	id 'java-library'
	id 'maven-publish'
}

// The Minecraft version rides along as semver build metadata, so the jar in a mods folder says
// which game it is for. Comparison ignores everything after '+', so the update checker still
// reads 2.0.0+1.21.1 and 2.0.0 as the same release.
version = "${mod_version}+${minecraft_version}"
group = maven_group

base {
	// hempdustry-common, hempdustry-fabric: the loader is in the jar's name, so a server owner can
	// tell the two downloads apart.
	archivesName = "${archives_base_name}-${project.name}"
}

// Mojang ships Java 8 to players of 1.16.5, so the classes are Java 8's. javac is 17's, with Jabel
// letting it read the newer lines' syntax (var, switch expressions, instanceof patterns) and write it
// as Java 8 bytecode; --release 8 keeps the Java 9+ library out of reach, and records stay refused.
java {
	toolchain.languageVersion = JavaLanguageVersion.of(17)
	withSourcesJar()
}

dependencies {
	annotationProcessor "com.github.bsideup.jabel:jabel-javac-plugin:${jabel_version}"
	compileOnly "com.github.bsideup.jabel:jabel-javac-plugin:${jabel_version}"
}

repositories {
	// Parchment: parameter names and javadoc over Mojang's names.
	maven {
		name = 'ParchmentMC'
		url = 'https://maven.parchmentmc.org'
	}
	maven {
		name = 'Sponge'                  // Mixin, which common compiles its mixins against
		url = 'https://repo.spongepowered.org/repository/maven-public/'
		content { includeGroupAndSubgroups('org.spongepowered') }
	}
	maven {
		name = 'Forge'
		url = 'https://maven.minecraftforge.net/'
	}
	// The recipe viewer. Compile-only -- see forge's dependencies.
	maven {
		name = 'BlameJared'              // JEI
		url = 'https://maven.blamejared.com/'
	}
	mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
	options.release = 8
	sourceCompatibility = '17'
	// Pinned rather than inherited: several source files carry non-ASCII characters, and the
	// platform default differs on a Windows contributor's machine.
	options.encoding = 'UTF-8'
	// -PallErrors: every compile error at once, not javac's first hundred
	if (project.hasProperty('allErrors')) {
		options.compilerArgs += ['-Xmaxerrs', '100000']
	}
}

// Read here, at configuration time: a task that reaches for `project` while it runs is refused by
// Gradle 10 and by the configuration cache.
def licenceSuffix = archives_base_name
tasks.named('jar', Jar) {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${licenceSuffix}" }
	}
	// The music is Nefuß's, under CC BY-NC-SA 4.0 rather than the mod's AGPL, and that licence
	// wants its attribution to travel with the files — so the credits ship inside the jar.
	from(rootProject.file('CREDITS.md')) {
		rename { "CREDITS_${licenceSuffix}.md" }
	}
}
