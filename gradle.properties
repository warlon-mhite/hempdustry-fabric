# Done to increase the memory available to gradle. Three gigabytes: common's first build
# decompiles Minecraft for ModDevGradle, which a one-gigabyte daemon runs out of.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
# Vanilla for the common project, which no loader touches: NeoForm, on
# https://projects.neoforged.net/neoforged/neoform. ModDevGradle's own version is in build.gradle.
# No Parchment from 26.1 on: the game ships unobfuscated, parameter names included.
neo_form_version=26.1.2-1
loader_version=0.20.1

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
neo_version=26.1.2.126
# What the NeoForge jar's manifest asks for: this Minecraft, and this NeoForge or a newer one.
minecraft_version_range=[26.1.2,26.2)
neo_version_range=[26.1.2.126,)

# Mod Properties
mod_version=2.1.0
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry
# Both mod manifests read these, so the mod describes itself once.
mod_name=Hempdustry
mod_description=Minecraft for stoners and hemprepreneurs. Grow hemp, harvest it, smoke it, cook with it or build with it, because that is most of what hemp has actually been for over the last five thousand years.

# Dependencies
fabric_version=0.155.3+26.1.2

# What common compiles its mixins against: the versions the oldest loader we support ships (Fabric
# Loader 0.20.1 carries Mixin 0.8.7 and MixinExtras 0.5.5; NeoForge carries newer).
mixin_version=0.8.7
mixinextras_version=0.5.5
jetbrains_annotations_version=26.0.2

# Recipe viewer. Compile-only: the plugin is optional and the mod runs without it.
#
# EMI IS GONE ON THIS LINE, not by choice. EMI's newest Fabric build is 1.1.24+1.21.1 and it has
# never been released for anything past 1.21.1 (still so for 26.1.2, checked 2026-11-10), so there is
# nothing to compile the plugin against. compat/emi/ is still alive on the 1.21.1 branches; bring it
# back the day EMI ships for 26.x.
#
# The oldest 26.1.2 JEI, deliberately: a plugin should compile against the earliest API it claims
# to support, and a player on a newer JEI loads the same plugin because this mod's fabric-api
# dependency is a floor, not a pin.
jei_version=29.5.0.24
# ...but not the one the dev clients run, which is the newest build: what a player has, so the
# plugin compiled against the floor is run against the JEI it will meet.
jei_runtime_version=29.53.0.115

# REI, the second viewer. Same deal: compile-only, loaded by REI's own entrypoints.
#
# REI's version numbers follow the game -- 26.1.x is the 26.1 line, and the artifacts are on
# maven.shedaniel.me. The oldest 26.1.2 build, for the same reason as JEI above.
rei_version=26.1.818
# What REI 26.1.818 depends on and its Fabric api no longer hands to a compile: architectury (its
# FluidStack) and cloth's basic-math (me.shedaniel.math). Compile-only, on Fabric.
architectury_version=20.0.6
basic_math_version=0.6.1
