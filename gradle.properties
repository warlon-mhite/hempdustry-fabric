# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.2
loader_version=0.18.2

# Mod Properties
mod_version=2.0.1-beta
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry

# Dependencies
fabric_version=0.139.4+1.21.11

# Recipe viewer. Compile-only: the plugin is optional and the mod runs without it.
#
# EMI IS GONE ON THIS LINE, not by choice. EMI's newest Fabric build is 1.1.24+1.21.1 and it has
# never been released for anything past 1.21.1, so there is nothing to compile the plugin against.
# compat/emi/ is still alive on the 1.21.1 branch; bring it back the day EMI ships for 1.21.11.
#
# The oldest 1.21.11 JEI, deliberately: a plugin should compile against the earliest API it claims
# to support, and a player on a newer JEI loads the same plugin because this mod's fabric-api
# dependency is a floor, not a pin.
jei_version=27.0.0.1

# REI, the second viewer. Same deal: compile-only, loaded by REI's own entrypoints.
#
# REI's version numbers followed the game as of 1.21.9 -- 21.11.x is the 1.21.11 line, and the
# artifacts are on maven.shedaniel.me. The oldest 1.21.11 build, for the same reason as JEI above.
rei_version=21.11.816
