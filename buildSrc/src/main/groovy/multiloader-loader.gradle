// A loader's project: it compiles common's sources and packs common's resources into its own jar,
// so the jar a player installs holds the whole mod, every class under the package and name it had
// before the split -- which is what keeps an addon compiled against an older release linking.
plugins {
	id 'multiloader-common'
}

configurations {
	commonJava {
		canBeResolved = true
	}
	commonResources {
		canBeResolved = true
	}
	commonGametestJava {
		canBeResolved = true
	}
	commonGametestResources {
		canBeResolved = true
	}
}

// common's sources, compiled here against this loader's Minecraft -- not common's jar, which would put
// every class on the classpath twice.
dependencies {
	commonJava project(path: ':common', configuration: 'commonJava')
	commonResources project(path: ':common', configuration: 'commonResources')
	commonGametestJava project(path: ':common', configuration: 'commonGametestJava')
	commonGametestResources project(path: ':common', configuration: 'commonGametestResources')
}

// The same for the game tests, once the loader's build declares its `gametest` source set: the shared
// tests run beside whatever the loader adds of its own.
sourceSets.matching { it.name == 'gametest' }.configureEach { gametest ->
	tasks.named(gametest.compileJavaTaskName, JavaCompile) {
		dependsOn(configurations.commonGametestJava)
		source(configurations.commonGametestJava)
	}
	tasks.named(gametest.processResourcesTaskName, ProcessResources) {
		dependsOn(configurations.commonGametestResources)
		from(configurations.commonGametestResources)
	}
}

tasks.named('compileJava', JavaCompile) {
	dependsOn(configurations.commonJava)
	source(configurations.commonJava)
}

tasks.named('processResources', ProcessResources) {
	dependsOn(configurations.commonResources)
	from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
	dependsOn(configurations.commonJava, configurations.commonResources)
	from(configurations.commonJava)
	from(configurations.commonResources)
}
