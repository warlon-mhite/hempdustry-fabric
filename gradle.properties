# Done to increase the memory available to gradle. Three gigabytes: the first build decompiles
# Minecraft for ForgeGradle, which a one-gigabyte daemon runs out of.
org.gradle.jvmargs=-Xmx3G
# ForgeGradle 5 does not take parallel project configuration well, and there is one project anyway.
org.gradle.parallel=false

# Minecraft 1.16.5, on Forge 36 -- the last 1.16 release, and what 1.16 packs settled on.
minecraft_version=1.16.5
# Mojang's full names (Architectury's Loom), with Parchment's parameter names and javadoc over them,
# as on the newer lines.
# 2022.03.06 is Parchment's last export for 1.16.5.
parchment_minecraft=1.16.5
parchment_version=2022.03.06

# Forge Properties
# check these on https://files.minecraftforge.net
# Built against 36.2.39, the build GanjaCraft worlds were made and tested on; Forge's newest 1.16.5
# build is 36.2.42, and 1.16.5 packs keep Forge current within 36.2.
forge_version=1.16.5-36.2.39
# What the jar's manifest asks for: this Minecraft, and Forge 36.2.39, the build the mod is tested on
# (the floor goes down only once an older build is tried).
minecraft_version_range=[1.16.5,1.17)
forge_version_range=[36.2.39,)

# Mod Properties
mod_version=2.1.0
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry
# The mod manifest reads these, so the mod describes itself once.
mod_name=Hempdustry
mod_description=Minecraft for stoners and hemprepreneurs. Grow hemp, harvest it, smoke it, cook with it or build with it, because that is most of what hemp has actually been for over the last five thousand years.

# Dependencies
# What the mixins compile against: the Mixin Forge 36.2.39 ships (0.8.4). Forge 36 has no jar-in-jar, so
# MixinExtras is shaded into the jar under the mod's own package (forge/build.gradle).
mixin_version=0.8.4
mixinextras_version=0.3.6
jetbrains_annotations_version=26.0.2
# Lets the sources keep the newer lines' syntax (var, switch expressions, instanceof patterns) while
# the classes stay Java 8 bytecode; the Java 9+ library is still out of reach (--release 8).
jabel_version=1.0.0

# Recipe viewer. Compile-only: the plugin is optional and the mod runs without it. EMI and REI's
# current API do not exist on 1.16.5.
jei_version=7.8.1.1018
