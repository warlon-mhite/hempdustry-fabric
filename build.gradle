// Declared once, here, so both projects' plugin loads in one classloader; each project applies it.
// Versions are literals because a plugins block cannot read gradle.properties. Architectury's Loom,
// because it builds Forge 1.16.5 in Mojang's full names (ForgeGradle 5 keeps MCP's class names there),
// so this line reads like the newer ones.
plugins {
	id 'dev.architectury.loom' version '1.14.476' apply false
}
