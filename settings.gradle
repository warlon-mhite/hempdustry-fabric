pluginManagement {
	repositories {
		maven {
			name = 'Architectury'
			url = 'https://maven.architectury.dev/'
		}
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Named here rather than after the checkout's folder, so every worktree builds the same projects.
rootProject.name = 'hempdustry'

// common: plain Minecraft, no loader -- most of the mod. forge: Forge's entry points, its side of the
// platform interfaces and its jar. Minecraft 1.16.5 is Forge only.
include 'common', 'forge'
