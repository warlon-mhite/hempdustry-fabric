# Done to increase the memory available to gradle. Three gigabytes: common's first build
# decompiles Minecraft for ModDevGradle, which a one-gigabyte daemon runs out of.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft 1.20.1, on Fabric and Forge 47 -- the 1.20.1 packs are Forge's; NeoForge's 1.20.1 fork
# (47.1) is no longer maintained, and loads Forge 47 mods anyway.
# check these on https://fabricmc.net/develop
minecraft_version=1.20.1
# Vanilla for the common project, which no loader touches: MCP's config for 1.20.1 (NeoForm starts at
# 1.20.2), through ModDevGradle's legacy plugin.
mcp_version=1.20.1
parchment_minecraft=1.20.1
parchment_version=2023.09.03
# The Fabric Loader the dev runs and the game tests use. The jar still asks only for 0.15.11 or
# later (fabric.mod.json), the oldest that ships MixinExtras, and common's mixins compile against what
# that one carries (below); but JEI 15.20, the last for 1.20.1, will not load on a loader before
# 0.16.3, so a dev client with JEI needs this one.
loader_version=0.16.14

# Forge Properties
# check these on https://files.minecraftforge.net
# Built against the newest 47.4 on purpose: 47.4.x is a stable line of fixes, and 1.20.1 packs keep
# Forge current within it.
forge_version=1.20.1-47.4.0
# What the Forge jar's manifest asks for: this Minecraft, and this Forge or a newer one.
minecraft_version_range=[1.20.1,1.20.2)
forge_version_range=[47.4.0,)

# Mod Properties
mod_version=2.1.0
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry
# Both mod manifests read these, so the mod describes itself once.
mod_name=Hempdustry
mod_description=Minecraft for stoners and hemprepreneurs. Grow hemp, harvest it, smoke it, cook with it or build with it, because that is most of what hemp has actually been for over the last five thousand years.

# Dependencies
# 0.92.2 is the build 1.20.1 packs settled on for a year; it has every module the mod uses, the data
# attachments included.
fabric_version=0.92.2+1.20.1

# What common compiles its mixins against: the versions the oldest loader we support ships. Forge 47
# ships no MixinExtras, so the Forge jar carries it (jar-in-jar).
mixin_version=0.8.5
mixinextras_version=0.3.6
jetbrains_annotations_version=26.0.2

# Recipe viewers. Compile-only: the plugins are optional and the mod runs without any of them.
emi_version=1.1.22+1.20.1
jei_version=15.20.0.106
rei_version=12.1.740
basic_math_version=0.6.1
architectury_version=9.2.14
# What REI needs beside it at run time on Forge (forge/build.gradle).
cloth_config_version=11.1.136
