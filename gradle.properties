# Done to increase the memory available to gradle. Three gigabytes: common's first build
# decompiles Minecraft for ModDevGradle, which a one-gigabyte daemon runs out of.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Minecraft 1.18.2, on Forge 40 only: the 1.18.2 packs are Forge's.
minecraft_version=1.18.2
# Vanilla for the common project, which no loader touches: MCP's config for 1.18.2, through
# ModDevGradle's legacy plugin.
mcp_version=1.18.2
parchment_minecraft=1.18.2
parchment_version=2022.11.06

# Forge Properties
# check these on https://files.minecraftforge.net
# Built against the newest 40.3 on purpose: 40.3.x is the last line of fixes for 1.18.2, and the packs
# still played keep Forge current within it.
forge_version=1.18.2-40.3.12
# What the Forge jar's manifest asks for: this Minecraft, and this Forge or a newer one.
minecraft_version_range=[1.18.2,1.19)
forge_version_range=[40.3.0,)

# Mod Properties
mod_version=2.1.0
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry
# The mod manifest reads these, so the mod describes itself once.
mod_name=Hempdustry
mod_description=Minecraft for stoners and hemprepreneurs. Grow hemp, harvest it, smoke it, cook with it or build with it, because that is most of what hemp has actually been for over the last five thousand years.

# What common compiles its mixins against: the Mixin Forge 40 ships, and the MixinExtras the Forge jar
# carries inside it (jar-in-jar).
mixin_version=0.8.5
mixinextras_version=0.3.6
jetbrains_annotations_version=26.0.2

# Recipe viewers. Compile-only: the plugins are optional and the mod runs without any of them. No EMI:
# it never shipped for Forge 1.18.2.
jei_version=10.2.1.1011
rei_version=8.4.778
architectury_version=4.12.94
# What REI needs beside it at run time on Forge (forge/build.gradle).
cloth_config_version=6.5.133
