// The mod's jar on Minecraft 1.16.5: common's sources and resources, compiled here, plus Forge's entry
// points and its side of the platform interfaces. Forge 36 runs in its own (SRG) names, so the jar is
// remapped from Mojang's names at build time; Architectury's Loom does it, the mixins' targets in place.
plugins {
	id 'multiloader-loader'
	id 'dev.architectury.loom'
}

def mixinConfigs = ['hempdustry.mixins.json', 'hempdustry.client.mixins.json', 'hempdustry.forge.mixins.json']

// The game tests: common's (multiloader-loader compiles them in), with their harness, and the test mod's
// Forge half. Dev-only: their own source set, never inside the mod's jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	// common's access widener, which Loom turns into the access transformer Forge reads
	accessWidenerPath = project(':common').file('src/main/resources/hempdustry.accesswidener')
	forge {
		convertAccessWideners = true
		extraAccessWideners.add loom.accessWidenerPath.get().asFile.name
		mixinConfigs.each { mixinConfig it }
	}
	// Forge finds a dev run's mods by these groups. The test mod is a mod of its own (Forge's mod id
	// cannot hold the hyphen of the tests' namespace), loaded by the game-test run alone.
	mods {
		hempdustry {
			sourceSet sourceSets.main
		}
		hempdustry_gametest {
			sourceSet sourceSets.gametest
		}
	}
	runs {
		client {
			client()
			runDir 'run'
			// -Pjoin=host:port: straight into that server, as 1.16.5's own --server/--port do
			def join = project.findProperty('join')
			if (join) {
				def (host, port) = join.toString().tokenize(':')
				programArgs '--server', host, '--port', port
			}
		}
		server {
			server()
			runDir 'run-server'
			programArg '--nogui'
		}
		// Every game test, on a dedicated server of its own that exits with the number of required tests
		// that failed:  ./gradlew :forge:runGameTestServer
		// Minecraft 1.16.5 ships no game-test server, so the test mod runs the tests itself once the
		// server has started (test/forge/ForgeGameTests).
		gameTestServer {
			server()
			source sourceSets.gametest
			runDir 'build/gametest'
			programArg '--nogui'
			property 'hempdustry.gametest', 'true'
			// -Pgametest=<regex>: only the tests whose name it finds, e.g. -Pgametest=sweepgametest
			def only = project.findProperty('gametest')
			if (only) {
				property 'hempdustry.gametest.only', only.toString()
			}
		}
		configureEach {
			property 'forge.logging.console.level', 'info'
		}
	}
}

// Forge 36 does not start on 17: the dev runs use the Java 8 a player of 1.16.5 has.
def java8 = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
tasks.withType(JavaExec).configureEach {
	javaLauncher = java8
}
// With CI set, Loom starts each run under xvfb-run, and on Java 8 that launch finds no main class
// (net.fabricmc.devlaunchinjector.Main). Nothing here needs a display (the game tests are a server), so
// the runs start as they do at home.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
	useXvfb.set(false)
}

dependencies {
	// the newer lines' syntax in the tests too, as in the mod (multiloader-common)
	gametestAnnotationProcessor "com.github.bsideup.jabel:jabel-javac-plugin:${jabel_version}"
	gametestCompileOnly "com.github.bsideup.jabel:jabel-javac-plugin:${jabel_version}"
	minecraft "com.mojang:minecraft:${minecraft_version}"
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
	}
	forge "net.minecraftforge:forge:${forge_version}"
	compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"

	// JEI, compiled against and never shipped; it finds the plugin by @JeiPlugin. One viewer, or none:
	//   ./gradlew :forge:runClient                  # JEI on the runtime (default)
	//   ./gradlew :forge:runClient -Pviewer=none    # no viewer
	modCompileOnly "mezz.jei:jei-${minecraft_version}:${jei_version}:api"
	def viewer = project.findProperty("viewer") ?: "jei"
	if (viewer == "jei") {
		modLocalRuntime "mezz.jei:jei-${minecraft_version}:${jei_version}"
	} else if (viewer != "none") {
		throw new GradleException("Unknown -Pviewer=${viewer}; use jei or none")
	}
}

// A player's Forge applies a jar's mixins only when its manifest lists them; Loom writes the list.
// A mixin config added to the resources but not to the list above would ship and never apply.
tasks.named('remapJar') {
	doLast {
		def shipped = zipTree(outputs.files.singleFile).matching { include '*.mixins.json' }.files*.name as Set
		def unlisted = shipped - (mixinConfigs as Set)
		if (unlisted) {
			throw new GradleException("The jar carries mixin configs its manifest does not list: ${unlisted}")
		}
		// Forge applies an access transformer entry only under the member's runtime (SRG) name. An access
		// widener entry on a method the mappings name only where it is declared (an override) comes out
		// of Loom's conversion in Mojang's name, opens nothing, and fails at run time with an
		// IllegalAccessError -- so every member here must be func_, field_ or a constructor.
		def at = zipTree(outputs.files.singleFile).matching { include 'META-INF/accesstransformer.cfg' }.singleFile
		def unmapped = at.readLines().findAll { line ->
			def parts = line.trim().split(/\s+/)
			parts.length >= 3 && !(parts[2] ==~ /(func_\d+_\w*|field_\d+_\w*|<init>)(\(.*)?/)
		}
		if (unmapped) {
			throw new GradleException("The access transformer names members Forge cannot find at run time:\n" + unmapped.join('\n'))
		}
	}
}

// The game test server's own log, read after every run: a run that logs a warning or an error nobody
// listed here fails, even when every test passed.
def expectedGametestLog = [
	// every batch starts its tests in one tick, and on a slower machine that tick runs long
	~/Can't keep up! Is the server overloaded\?/,
	// a fresh run directory: no server files yet, and the server says so
	~/Failed to load properties from file: server\.properties/,
	~/Failed to load eula\.txt/,
	// ...and Forge writes its own config files there the first time, and the world's anew every run
	~/\(FMLConfig\) (Configuration file .*\/config\/fml\.toml is not correct\. Correcting|Incorrect key \[\w+\] was corrected from null)/,
	~/\(ForgeConfigSpec\) (Configuration file (\S+\/config|\.\/world\/serverconfig)\/[\w-]+\.toml is not correct\. Correcting|Incorrect key [\w .]+ was corrected from null to its default)/,
	// 1.16.5's dedicated server reads a flat world's generator-settings with a codec that needs registry
	// access it is not given, so it always logs this (with the keys an empty setting lacks) and builds
	// the classic flat, which is what the tests want
	~/\(Minecraft\) (No key layers in MapLike\[\{\}\]; No key structures in MapLike\[\{\}\]; )?Not a registry ops$/,
	// 1.16.5 checks its commands for ambiguous arguments at every start, and finds its own /teleport's
	~/\(Minecraft\) Ambiguity between arguments \[teleport, /,
	// the test server is offline on purpose (no account service in a test), and vanilla says so in four lines
	~/\*\*\*\* SERVER IS RUNNING IN OFFLINE\/INSECURE MODE!/,
	~/The server will make no attempt to authenticate usernames\. Beware\./,
	~/While this makes the game possible to play without internet access, it also opens up the ability for hackers to connect with any username they choose\./,
	~/To change this, set "online-mode" to "true" in the server\.properties file\./,
	// a test that takes an entity away in the tick a later test's player joins: 1.16.5 keeps a removed
	// entity in the world, and tracked, until its entities next tick, and says so to each new player
	~/\(Minecraft\) Fetching packet for removed entity /,
	// a_broken_config_is_left_alone feeds the loader four broken files on purpose
	~/\(hempdustry\) .*config\/hempdustry\.json/,
	// every_config_extreme_keeps_the_numbers_sane pushes every setting past its range
	~/\(hempdustry\) Config \S+ was (-?1000000000|-?1\.0E9|1\.0E-9), clamped to/,
]
def gametestDir = file('build/gametest')
def gametestLog = new File(gametestDir, 'logs/latest.log')
// The world every run starts from: vanilla's game-test world on the newer lines -- flat classic, seed 0,
// no structures, creative, normal difficulty -- made anew each time. Offline, on a port of its own.
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
	doFirst {
		delete new File(gametestDir, 'world')
		delete new File(gametestDir, 'gametest-results.txt')
		gametestDir.mkdirs()
		new File(gametestDir, 'eula.txt').text = 'eula=true\n'
		new File(gametestDir, 'server.properties').text = [
			// vanilla's classic flat (FlatLevelGeneratorSettings#getDefault): a dedicated 1.16.5 server cannot
			// read generator-settings (see the log list above) and always builds this one
			'level-type=flat',
			// 1.16.5 reads a seed of 0 as "no seed" and picks a random one; a text seed is its hashCode,
			// and this one's is 0
			'level-seed=f5a5a608',
			'generate-structures=false',
			'gamemode=creative',
			'difficulty=normal',
			// Mob spawning is off by game rule (GameTestRunner#start), as on vanilla's test server. Not
			// by spawn-animals or spawn-npcs: a 1.16.5 dedicated server with those off removes every
			// animal and villager on its next tick, the ones a test spawns included.
			'online-mode=false',
			'server-port=' + (project.findProperty('gametestPort') ?: '25871'),
			'max-players=100',
		].join('\n') + '\n'
	}
	doLast {
		def unexpected = gametestLog.readLines().findAll { line ->
			(line.contains('/WARN]') || line.contains('/ERROR]') || line.contains('/FATAL]')) && !expectedGametestLog.any { line =~ it }
		}
		if (unexpected) {
			throw new GradleException("Every game test passed, but the server logged " + unexpected.size()
					+ " warning(s) nobody expected (${gametestLog}):\n" + unexpected.join("\n"))
		}
	}
}

def manifest = [
	version                : version,
	name                   : mod_name,
	description            : mod_description,
	minecraft_version_range: minecraft_version_range,
	forge_version_range    : forge_version_range,
]
tasks.named('processResources', ProcessResources) {
	inputs.properties manifest
	filesMatching('META-INF/mods.toml') {
		expand manifest
	}
}

// Publishing: `publishToMavenLocal` puts hempdustry-forge in the local maven, so an addon can compile
// against com.warlonmhite.hempdustry.api and the Forge events. The published jar is the remapped one,
// as Forge 36 runs it.
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = base.archivesName.get()
			from components.java

			pom {
				name = "Hempdustry"
				description = "Minecraft for stoners and hemprepreneurs."
				url = "https://github.com/warlon-mhite/hempdustry-java"
				licenses {
					license {
						// Code and data only.
						name = "AGPL-3.0-only"
						url = "https://www.gnu.org/licenses/agpl-3.0.txt"
					}
				}
			}
		}
	}

	repositories {
		mavenLocal()
	}
}
