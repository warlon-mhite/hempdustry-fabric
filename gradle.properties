# Done to increase the memory available to gradle. Three gigabytes: common's first build
# decompiles Minecraft for ModDevGradle, which a one-gigabyte daemon runs out of.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.3
# Vanilla for the common project, which no loader touches: NeoForm, on
# https://projects.neoforged.net/neoforged/neoform. ModDevGradle's own version is in build.gradle.
# No Parchment from 26.1 on: the game ships unobfuscated, parameter names included.
neo_form_version=26.3-1
loader_version=0.20.1

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
neo_version=26.3.0.101
# What the NeoForge jar's manifest asks for: this Minecraft, and this NeoForge or a newer one.
minecraft_version_range=[26.3,26.4)
neo_version_range=[26.3.0.101,)

# Mod Properties
mod_version=2.1.0
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry
# Both mod manifests read these, so the mod describes itself once.
mod_name=Hempdustry
mod_description=Minecraft for stoners and hemprepreneurs. Grow hemp, harvest it, smoke it, cook with it or build with it, because that is most of what hemp has actually been for over the last five thousand years.

# Dependencies
fabric_version=0.165.0+26.3

# What common compiles its mixins against: the versions the oldest loader we support ships (Fabric
# Loader 0.20.1 carries Mixin 0.8.7 and MixinExtras 0.5.5; NeoForge carries newer).
mixin_version=0.8.7
mixinextras_version=0.5.5
jetbrains_annotations_version=26.0.2

# Recipe viewer. Compile-only: the plugin is optional and the mod runs without it.
#
# EMI IS GONE ON THIS LINE, not by choice. EMI's newest Fabric build is 1.1.24+1.21.1 and it has
# never been released for anything past 1.21.1 (still so for 26.3, checked 2026-11-03), so there is
# nothing to compile the plugin against. compat/emi/ is still alive on the 1.21.1 branches; bring it
# back the day EMI ships for 26.x.
#
# The oldest 26.3 JEI, deliberately: a plugin should compile against the earliest API it claims
# to support, and a player on a newer JEI loads the same plugin because this mod's fabric-api
# dependency is a floor, not a pin. (31.0.0.5 is the first build with both a Fabric and a NeoForge jar.)
jei_version=31.0.0.5
# ...but not the one the dev clients run. The run uses a current build on both loaders -- what a
# player has, and so the plugin compiled against the floor is run against the JEI it will meet. On
# 26.2 the oldest NeoForge build could not even start (it listened for an event NeoForge had removed),
# which is how this line came to keep the two apart.
jei_runtime_version=31.17.0.108

# REI, the second viewer. Same deal: compile-only, loaded by REI's own entrypoints.
#
# REI's version numbers follow the game -- 26.3.x is the 26.3 line, and the artifacts are on
# maven.shedaniel.me. The oldest 26.3 build, for the same reason as JEI above.
rei_version=26.3.822
# What REI 26.3.822 depends on and its Fabric api no longer hands to a compile: architectury (its
# FluidStack) and cloth's basic-math (me.shedaniel.math). Compile-only, on Fabric. Architectury 22
# is the first line that loads on NeoForge again, so REI runs on both loaders here.
architectury_version=22.0.3
# What the NeoForge dev client runs under REI instead of the 22.0.3 REI's POM brings: 22.0.3's
# MixinBlockTransformer finds no target in NeoForge 26.3.0.101 and the client crashes at bootstrap;
# 22.0.5 (NeoForge floor 26.3.0.48) rewrote that mixin. Players install Architectury themselves.
architectury_runtime_version=22.0.5
basic_math_version=0.6.1
