# Done to increase the memory available to gradle. Three gigabytes: common's first build
# decompiles Minecraft for ModDevGradle, which a one-gigabyte daemon runs out of.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.1
# Vanilla for the common project, which no loader touches: NeoForm, on
# https://projects.neoforged.net/neoforged/neoform. ModDevGradle's own version is in build.gradle.
neo_form_version=1.21.1-20240808.144430
parchment_minecraft=1.21.1
parchment_version=2024.11.17
loader_version=0.16.5

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
# Built against a year-old 21.1 on purpose, as the viewers below are against their oldest: this line
# is a mature one, and a pack still on an older 21.1 should not be told to update NeoForge for us.
neo_version=21.1.209
# What the NeoForge jar's manifest asks for: this Minecraft, and this NeoForge or a newer one.
minecraft_version_range=[1.21.1,1.21.2)
neo_version_range=[21.1.209,)

# Mod Properties
mod_version=2.0.3
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry
# Both mod manifests read these, so the mod describes itself once.
mod_name=Hempdustry
mod_description=Minecraft for stoners and hemprepreneurs. Grow hemp, harvest it, smoke it, cook with it or build with it, because that is most of what hemp has actually been for over the last five thousand years.

# Dependencies
fabric_version=0.105.0+1.21.1

# What common compiles its mixins against: the versions the oldest loader we support ships (Fabric
# Loader 0.16.5 carries Mixin 0.8.7 and MixinExtras 0.4.1; NeoForge carries newer).
mixin_version=0.8.7
mixinextras_version=0.4.1
jetbrains_annotations_version=26.0.2

# Recipe viewers. Compile-only: the plugins are optional and the mod runs without any of them.
emi_version=1.1.24+1.21.1
# NOT the newest JEI for 1.21.1. From 19.42.0.379 onward JEI requires Fabric API 0.116.5+, and this
# mod builds against 0.105.0; 19.39.0.372 is the last one that accepts it. That is the right version
# to compile against anyway -- the oldest API the plugin should work with -- and a player running
# JEI 19.44 loads the same plugin, because this mod's fabric-api range is a floor, not a pin.
jei_version=19.39.0.372

# REI 16.x is the 1.21/1.21.1 line. NOT the oldest of it, unlike the JEI pin above: 16.0.729's
# published pom lists no dependencies at all, so nothing pulls in architectury -- and that is where
# me.shedaniel.math.Rectangle lives, which every DisplayCategory signature names. 16.0.754 is the
# oldest whose pom is complete. Its API is identical where this plugin touches it (checked with
# javap), and a player on 16.0.799 loads the same classes.
rei_version=16.0.754
# me.shedaniel.math.Rectangle, which every DisplayCategory signature names, is not in REI: it is
# this little standalone library, and REI 16's api pom declares no dependencies at all, so nothing
# pulls it in. Not a mod -- it has no Minecraft references and needs no remapping.
basic_math_version=0.6.1
# Same story: EntryIngredients has fluid overloads whose signatures name dev.architectury.fluid,
# and javac wants the class present to resolve the item ones. REI 16 pulls it in at runtime.
architectury_version=13.0.6
