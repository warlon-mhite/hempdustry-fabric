# Done to increase the memory available to gradle. Three gigabytes: common's first build
# decompiles Minecraft for ModDevGradle, which a one-gigabyte daemon runs out of.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
# Vanilla for the common project, which no loader touches: NeoForm, on
# https://projects.neoforged.net/neoforged/neoform. ModDevGradle's own version is in build.gradle.
neo_form_version=1.21.11-20251209.172050
parchment_minecraft=1.21.11
parchment_version=2025.12.20
loader_version=0.18.2

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
neo_version=21.11.45
# What the NeoForge jar's manifest asks for: this Minecraft, and this NeoForge or a newer one.
minecraft_version_range=[1.21.11,1.21.12)
neo_version_range=[21.11.45,)

# Mod Properties
mod_version=2.1.0
maven_group=com.warlonmhite.hempdustry
archives_base_name=hempdustry
# Both mod manifests read these, so the mod describes itself once.
mod_name=Hempdustry
mod_description=Minecraft for stoners and hemprepreneurs. Grow hemp, harvest it, smoke it, cook with it or build with it, because that is most of what hemp has actually been for over the last five thousand years.

# Dependencies
fabric_version=0.139.4+1.21.11

# What common compiles its mixins against: the versions the oldest loader we support ships (Fabric
# Loader 0.18.2 carries Mixin 0.8.7 and MixinExtras 0.5.0; NeoForge carries newer).
mixin_version=0.8.7
mixinextras_version=0.5.0
jetbrains_annotations_version=26.0.2

# Recipe viewer. Compile-only: the plugin is optional and the mod runs without it.
#
# EMI IS GONE ON THIS LINE, not by choice. EMI's newest Fabric build is 1.1.24+1.21.1 and it has
# never been released for anything past 1.21.1, so there is nothing to compile the plugin against.
# compat/emi/ is still alive on the 1.21.1 branch; bring it back the day EMI ships for 1.21.11.
#
# The oldest 1.21.11 JEI, deliberately: a plugin should compile against the earliest API it claims
# to support, and a player on a newer JEI loads the same plugin because this mod's fabric-api
# dependency is a floor, not a pin.
jei_version=27.0.0.1

# REI, the second viewer. Same deal: compile-only, loaded by REI's own entrypoints.
#
# REI's version numbers followed the game as of 1.21.9 -- 21.11.x is the 1.21.11 line, and the
# artifacts are on maven.shedaniel.me. The oldest 1.21.11 build, for the same reason as JEI above.
rei_version=21.11.816
